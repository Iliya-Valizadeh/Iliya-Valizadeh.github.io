The pipeline fetched {{ nrc.files_fetched }} monthly trip files (January 2023 to March
2025) and loaded every one: it kept {{ nrc.rows_kept }} rows and set aside
{{ nrc.rows_quarantined }} rows that failed a check. The congestion pricing result is
still to come.
"""

