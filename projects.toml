# Config for build.py's number pipeline, per docs/decisions/0001, 0002 and 0003.
#
# Same shape as the profile repo's projects.toml, because both read the same schema
# with the shared code in scripts/shared/render_readme.py (ADR 0002). `kind` is this
# site's own addition (ADR 0003): "work" gets a case-study page, "tool" gets a "For
# everyone" page, "standard" gets a link and no card and no number. No page today
# uses any of the `[[project.number]]` placeholders below; that starts in the Home
# and project-page tasks. This file exists now so the fetch/match/format pipeline
# (scripts/check_numbers.py, scripts/build_sources.py) has real config to run and
# test against, per ADR 0002's number-flow design.
#
# `metrics = false` means the repo has no reports/metrics.json: no metrics_file, no
# numbers, no headline. Per ADR 0003, `fraud-review-queue` has no entry here.

[[project]]
repo = "credit-risk-scorecard"
kind = "work"
metrics_file = "reports/metrics.json"

[[project.number]]
id = "credit_risk_scorecard.lightgbm_roc_auc"
path = "models.lightgbm.roc_auc"
row = "[ROC-AUC](docs/glossary.md#roc-auc) and [PR-AUC](docs/glossary.md#pr-auc) by model, with 95% intervals"
decimals = 3

[[project.number]]
id = "credit_risk_scorecard.lightgbm_roc_auc_lo"
path = "bootstrap.roc_auc.lightgbm.lo"
row = "[ROC-AUC](docs/glossary.md#roc-auc) and [PR-AUC](docs/glossary.md#pr-auc) by model, with 95% intervals"
decimals = 3

[[project.number]]
id = "credit_risk_scorecard.lightgbm_roc_auc_hi"
path = "bootstrap.roc_auc.lightgbm.hi"
row = "[ROC-AUC](docs/glossary.md#roc-auc) and [PR-AUC](docs/glossary.md#pr-auc) by model, with 95% intervals"
decimals = 3

[[project.number]]
id = "credit_risk_scorecard.logreg_roc_auc"
path = "models.logreg.roc_auc"
row = "[ROC-AUC](docs/glossary.md#roc-auc) and [PR-AUC](docs/glossary.md#pr-auc) by model, with 95% intervals"
decimals = 3

[[project.number]]
id = "credit_risk_scorecard.observed_default_rate"
path = "calibration.observed_default_rate_test"
row = "Observed default rate on test"
decimals = 2
percent = true

