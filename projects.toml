row = "Recurring precision"
decimals = 1
percent = true
synthetic = true

[[project.number]]
id = "second_look.baseline_recurring_recall"
path = "baseline.recurring.recall.value"
row = "Baseline recurring precision and recall"
decimals = 4
synthetic = true

[[project.number]]
id = "second_look.interval_level"
path = "interval.level"
row = "Interval level"
decimals = 0
percent = true
synthetic = true

[[project.number]]
id = "second_look.recurring_precision_share"
path = "engine.recurring.precision.value"
row = "Recurring precision"
