# The projects the site shows and the numbers it may use, per docs/decisions/0001,
# 0002 and 0015.
#
# The number entries have the same shape as the profile repo's projects.toml, because
# both are read by the shared code in scripts/shared/render_readme.py (ADR 0002). The
# rest is this site's own, read by build.py:
#
# - `kind` (ADR 0015): "featured" projects lead the Home page, in the order of this
#   file. "other" projects get one short entry each under them. "standard" gets nothing.
# - A featured project needs `title` and `result`, and may have `about` (one line on
#   what it is). Its chart is `chart` (a file in static/charts/, copied from the
#   repo), `chart_source` (that file's path in the repo), `chart_alt` and
#   `chart_caption`. The four go together. An "other" project needs `title` and
#   `summary`.
# - `page` is the project's own page on this site, built from
#   content/projects/<repo>.md. `live_url` is a working copy people can try.
# - Prose is Markdown and may use `{{ id }}` number placeholders defined below. A
#   sentence that uses a number marked `synthetic = true` must say "synthetic", or the
#   build stops.
# - `[[project.flag]]`: a true/false value in metrics.json, shown as one of two
#   sentences (`if_true`, `if_false`).
#
# Additions from ADR 0008, read by build.py only:
#
# - A `[[project.number]]` entry may set `file` when its number is in a second results
#   file. A whole-number part of `path` picks a list item. `thousands = true` also
#   reads a Value cell like "307,511" as one number.
# - `[[project.row_number]]` is a row entry: the number at position `index` (from 0)
#   of the Value cell of CLAIMS.md row `row`, shown as written. Only for rows whose
#   Source is not a JSON file.
#
# `metrics = false` means the repo has no results file: no metrics_file and no numbers.

